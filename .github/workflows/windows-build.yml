name: Windows build and smoke test

# Release gate: no Windows setup is published unless the frozen EXE answers /health
# and can create its SQLite database plus CSV/XLSX exports.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Core tests
        shell: pwsh
        run: |
          $env:FEWURA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'fewura-core-test'
          python -m compileall -q app prospect_launcher.py TESTER_PROSPECT.py
          python TESTER_PROSPECT.py

      - name: Build Windows EXE
        shell: pwsh
        run: pyinstaller --clean --noconfirm installer/prospect.spec

      - name: Smoke-test frozen EXE
        shell: pwsh
        run: .\TESTER_EXE_WINDOWS.ps1 -ExePath '.\dist\FEWURA_Prospect\FEWURA_Prospect.exe'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe introuvable apres installation Inno Setup.' }
          & $iscc '.\installer\FEWURA_Prospect.iss'
          if (-not (Test-Path '.\installer\output\FEWURA_PROSPECT_Setup_1.0.2.exe')) {
            throw 'Le Setup 1.0.2 attendu n a pas ete cree.'
          }

      - name: Upload tested Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: FEWURA-PROSPECT-Windows-1.0.2
          path: installer/output/FEWURA_PROSPECT_Setup_1.0.2.exe
          if-no-files-found: error
