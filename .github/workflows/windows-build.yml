name: Windows build and smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Core tests
        shell: pwsh
        run: |
          $env:FEWURA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'fewura-core-test'
          python -m compileall -q app prospect_launcher.py TESTER_PROSPECT.py
          python TESTER_PROSPECT.py
          python -c "from app.search.engine import _build_query; q=_build_query(43.6045,1.4442,20000,'hotels'); assert 'tourism' in q and 'hotel' in q and 'out tags center' in q"
          python -c "from app.main import app; assert app.version == '1.0.6'"
      - name: Build Windows EXE
        shell: pwsh
        run: pyinstaller --clean --noconfirm installer/prospect.spec
      - name: Smoke-test frozen EXE including shutdown
        shell: pwsh
        run: .\TESTER_EXE_WINDOWS.ps1 -ExePath '.\dist\FEWURA_Prospect\FEWURA_Prospect.exe'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe introuvable' }
          & $iscc '.\installer\FEWURA_Prospect.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup code $LASTEXITCODE" }
          if (-not (Test-Path '.\installer\output\FEWURA_PROSPECT_Setup_1.0.6.exe')) { throw 'Setup 1.0.6 absent' }
      - name: Install final Setup silently
        shell: pwsh
        run: |
          $setup=(Resolve-Path '.\installer\output\FEWURA_PROSPECT_Setup_1.0.6.exe').Path
          $installDir=Join-Path $env:RUNNER_TEMP 'FEWURA-PROSPECT-installed'
          $p=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation code $($p.ExitCode)" }
          "FEWURA_INSTALLED_EXE=$(Join-Path $installDir 'FEWURA_Prospect.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Smoke-test installed application including shutdown
        shell: pwsh
        run: .\TESTER_EXE_WINDOWS.ps1 -ExePath "$env:FEWURA_INSTALLED_EXE"
      - name: Upload fully tested Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: FEWURA-PROSPECT-Windows-1.0.6-TESTED
          path: installer/output/FEWURA_PROSPECT_Setup_1.0.6.exe
          if-no-files-found: error
