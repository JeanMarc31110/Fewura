name: Windows build and smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Core tests
        shell: pwsh
        run: |
          $env:FEWURA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'fewura-core-test'
          python -m compileall -q app prospect_launcher.py TESTER_PROSPECT.py
          python TESTER_PROSPECT.py
          python -c "from app.search.engine import _build_query; q=_build_query(43.6045,1.4442,20000,'hotels'); assert 'tourism' in q and 'hotel' in q and 'out tags center' in q"
          python -c "from app.main import app; assert app.version == '1.0.5'"

      - name: Build Windows EXE
        shell: pwsh
        run: pyinstaller --clean --noconfirm installer/prospect.spec

      - name: Smoke-test frozen EXE including shutdown
        shell: pwsh
        run: .\TESTER_EXE_WINDOWS.ps1 -ExePath '.\dist\FEWURA_Prospect\FEWURA_Prospect.exe'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Locate Inno Setup and build Setup
        shell: pwsh
        run: |
          $iscc = $null
          $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($command) { $iscc = $command.Source }
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "$env:ChocolateyInstall\bin\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $iscc) {
            $roots = @($env:ChocolateyInstall,$env:ProgramFiles,${env:ProgramFiles(x86)},$env:LOCALAPPDATA) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
            foreach ($root in $roots) {
              $found = Get-ChildItem -Path $root -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $iscc = $found.FullName; break }
            }
          }
          if (-not $iscc) { throw 'ISCC.exe introuvable apres recherche complete.' }
          & $iscc '.\installer\FEWURA_Prospect.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup a retourne le code $LASTEXITCODE" }
          $setup = '.\installer\output\FEWURA_PROSPECT_Setup_1.0.5.exe'
          if (-not (Test-Path $setup)) { throw 'Le Setup 1.0.5 attendu n a pas ete cree.' }

      - name: Install final Setup silently
        shell: pwsh
        run: |
          $setup = (Resolve-Path '.\installer\output\FEWURA_PROSPECT_Setup_1.0.5.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'FEWURA-PROSPECT-installed'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir")
          $p = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation silencieuse echouee: code $($p.ExitCode)" }
          $installedExe = Join-Path $installDir 'FEWURA_Prospect.exe'
          if (-not (Test-Path $installedExe)) { throw "EXE installe introuvable: $installedExe" }
          "FEWURA_INSTALLED_EXE=$installedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-test installed application including shutdown
        shell: pwsh
        run: .\TESTER_EXE_WINDOWS.ps1 -ExePath "$env:FEWURA_INSTALLED_EXE"

      - name: Upload fully tested Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: FEWURA-PROSPECT-Windows-1.0.5-TESTED
          path: installer/output/FEWURA_PROSPECT_Setup_1.0.5.exe
          if-no-files-found: error
